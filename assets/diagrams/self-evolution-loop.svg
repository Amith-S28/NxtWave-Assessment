<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="self-evol-title self-evol-desc">
  <title id="self-evol-title">NxtWave Cross-Run Self-Evolution Lifecycle</title>
  <desc id="self-evol-desc">Diagram showing how evaluation failures in Run N are distilled by an LLM into persistent guidelines stored in SQLite, which are then proactively injected into the generator prompt on Run N+1 to prevent future mistakes.</desc>

  <defs>
    <marker id="arr-evol" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-evol-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="arr-evol-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-evol-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc" rx="8"/>

  <!-- Header -->
  <text x="40" y="44" fill="#0f172a" font-size="20" font-weight="600" font-family="'Geist', 'Segoe UI', sans-serif">Cross-Run Persistent Self-Evolution Lifecycle</text>
  <text x="40" y="66" fill="#64748b" font-size="12" font-family="'Geist Mono', monospace">SQLITE PERSISTENCE • AUTOMATIC RULE DISTILLATION • PROACTIVE PROMPT PATCHING</text>

  <!-- Central SQLite Memory Store Hub (Focal Node) -->
  <rect x="360" y="196" width="240" height="96" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="372" y="204" width="76" height="14" rx="2" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.4)" stroke-width="0.8"/>
  <text x="410" y="214" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PERSISTENCE</text>
  
  <text x="480" y="244" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite System Memory</text>
  <text x="480" y="262" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/memory.db • evolved_instructions</text>
  <text x="480" y="278" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"Always define Vector DB as digital cabinet"</text>

  <!-- LEFT ZONE: RUN N (The Learning Phase) -->
  <rect x="40" y="96" width="280" height="320" rx="8" fill="rgba(234,88,12,0.02)" stroke="rgba(234,88,12,0.2)" stroke-width="1"/>
  <rect x="56" y="88" width="104" height="16" rx="2" fill="#f8fafc"/>
  <text x="108" y="100" fill="#ea580c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">RUN N: DISCOVERY</text>

  <!-- Step N.1: Initial Draft with Flaw -->
  <rect x="56" y="120" width="248" height="60" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="70" y="142" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist', sans-serif">1. Initial Generation Draft</text>
  <text x="70" y="160" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Generator drops unexplained term 'Vector DB'</text>

  <!-- Connector N1 -> N2 -->
  <path d="M 180,180 V 206" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-evol)"/>

  <!-- Step N.2: Rubric Evaluator Catches It -->
  <rect x="56" y="212" width="248" height="64" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="70" y="234" fill="#ea580c" font-size="11" font-weight="600" font-family="'Geist', sans-serif">2. Evaluator Flags Checkpoint #5</text>
  <text x="70" y="252" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">FAIL: Unexplained Jargon ('Vector DB')</text>
  <text x="70" y="264" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Suggestion: Define as digital filing cabinet</text>

  <!-- Connector N2 -> N3 -->
  <path d="M 180,276 V 302" fill="none" stroke="#ea580c" stroke-width="1.2" marker-end="url(#arr-evol-accent)"/>

  <!-- Step N.3: LLM Memory Distiller -->
  <rect x="56" y="308" width="248" height="68" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="70" y="330" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist', sans-serif">3. LLM Rule Synthesizer</text>
  <text x="70" y="348" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Distills failure &amp; fix into permanent rule:</text>
  <text x="70" y="362" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace">"Always define Vector DB on first use"</text>

  <!-- Connector from Distiller to SQLite Store -->
  <path d="M 304,342 H 340 Q 350,342 350,332 V 264 Q 350,254 360,254" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-evol-blue)"/>
  <rect x="314" y="328" width="48" height="12" rx="2" fill="#f8fafc"/>
  <text x="338" y="337" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PERSIST</text>

  <!-- RIGHT ZONE: RUN N+1 (Proactive Avoidance) -->
  <rect x="640" y="96" width="280" height="320" rx="8" fill="rgba(22,163,74,0.02)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <rect x="656" y="88" width="124" height="16" rx="2" fill="#f8fafc"/>
  <text x="718" y="100" fill="#16a34a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">RUN N+1: EVOLVED</text>

  <!-- Connector from SQLite Store to Run N+1 Load -->
  <path d="M 600,234 H 610 Q 620,234 620,224 V 160 Q 620,150 630,150 H 648" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-evol-blue)"/>
  <rect x="598" y="136" width="48" height="12" rx="2" fill="#f8fafc"/>
  <text x="622" y="145" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">INJECT</text>

  <!-- Step N+1.1: Load Memory & Patch Prompt -->
  <rect x="656" y="120" width="248" height="68" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="670" y="142" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist', sans-serif">1. Memory Injected at Start</text>
  <text x="670" y="160" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace">Generator receives evolved guideline</text>
  <text x="670" y="174" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Proactively includes filing cabinet analogy</text>

  <!-- Connector N+1.1 -> N+1.2 -->
  <path d="M 780,188 V 214" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-evol-green)"/>

  <!-- Step N+1.2: Evaluator Runs & Passes 100% -->
  <rect x="656" y="220" width="248" height="64" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="670" y="242" fill="#16a34a" font-size="11" font-weight="600" font-family="'Geist', sans-serif">2. Evaluator: Checkpoint #5 PASS</text>
  <text x="670" y="260" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">All 7 Checkpoints Clear on Attempt #1</text>
  <text x="670" y="272" fill="#16a34a" font-size="8" font-family="'Geist Mono', monospace">Zero retries needed for this failure mode</text>

  <!-- Connector N+1.2 -> N+1.3 -->
  <path d="M 780,284 V 310" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-evol-green)"/>

  <!-- Step N+1.3: Immediate Deliverable Output -->
  <rect x="656" y="316" width="248" height="60" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="670" y="338" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist', sans-serif">3. High Quality Shipping Output</text>
  <text x="670" y="356" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Faster convergence, lower token cost</text>

  <!-- Bottom Legend -->
  <line x1="40" y1="432" x2="920" y2="432" stroke="rgba(30,41,59,0.12)" stroke-width="0.8"/>
  <text x="40" y="456" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  
  <circle cx="120" cy="453" r="4" fill="#ea580c"/>
  <text x="132" y="456" fill="#334155" font-size="9" font-family="'Geist', sans-serif">Failure Discovery &amp; Diagnosis</text>

  <circle cx="340" cy="453" r="4" fill="#2563eb"/>
  <text x="352" y="456" fill="#334155" font-size="9" font-family="'Geist', sans-serif">Rule Synthesis &amp; Prompt Injection</text>

  <circle cx="590" cy="453" r="4" fill="#16a34a"/>
  <text x="602" y="456" fill="#334155" font-size="9" font-family="'Geist', sans-serif">Proactive Avoidance &amp; 1st-Try Pass</text>
</svg>
