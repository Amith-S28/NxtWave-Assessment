<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="evol-title evol-desc">
  <title id="evol-title">NxtWave Cross-Run Self-Evolution Lifecycle</title>
  <desc id="evol-desc">Diagram showing how evaluation failures in Run N are distilled by an LLM into persistent guidelines in SQLite, which are proactively injected into Run N+1 to prevent future mistakes.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    </style>
    <marker id="arr-evol-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arr-evol-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arr-evol-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="44" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Cross-Run Persistent Self-Evolution Lifecycle</text>
  <text x="40" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SQLITE PERSISTENCE • AUTOMATIC RULE DISTILLATION • PROACTIVE PROMPT PATCHING</text>

  <!-- Central SQLite Memory Store Hub (Focal Accent) -->
  <rect x="360" y="196" width="240" height="96" rx="8" fill="#f5f5f5"/>
  <rect x="360" y="196" width="240" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="372" y="204" width="76" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
  <text x="410" y="213" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSISTENCE</text>
  
  <text x="480" y="242" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite System Memory</text>
  <text x="480" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/memory.db • evolved_instructions</text>
  <text x="480" y="276" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"Always define Vector DB on first use"</text>

  <!-- LEFT ZONE: RUN N (The Learning Phase) -->
  <rect x="40" y="96" width="280" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="56" y="88" width="120" height="16" rx="2" fill="#f5f5f5"/>
  <text x="116" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">RUN N: DISCOVERY</text>

  <!-- Step N.1: Initial Draft with Flaw -->
  <rect x="56" y="120" width="248" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="120" width="248" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="70" y="142" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">1. Initial Generation Draft</text>
  <text x="70" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Generator drops unexplained term 'Vector DB'</text>

  <!-- Connector N1 -> N2 -->
  <path d="M 180,180 V 204" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-evol-muted)"/>

  <!-- Step N.2: Rubric Evaluator Catches It -->
  <rect x="56" y="212" width="248" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="212" width="248" height="64" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="70" y="234" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif">2. Evaluator Flags Checkpoint #5</text>
  <text x="70" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FAIL: Unexplained Jargon ('Vector DB')</text>
  <text x="70" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Suggestion: Define as digital filing cabinet</text>

  <!-- Connector N2 -> N3 -->
  <path d="M 180,276 V 300" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-evol-accent)"/>

  <!-- Step N.3: LLM Memory Distiller -->
  <rect x="56" y="308" width="248" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="308" width="248" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="70" y="330" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">3. LLM Rule Synthesizer</text>
  <text x="70" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Distills failure &amp; fix into permanent rule:</text>
  <text x="70" y="362" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace">"Always define Vector DB on first use"</text>

  <!-- Connector from Distiller to SQLite Store -->
  <path d="M 304,342 H 340 Q 350,342 350,332 V 264 Q 350,254 360,254" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arr-evol-link)"/>
  <rect x="314" y="328" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="338" y="337" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERSIST</text>

  <!-- RIGHT ZONE: RUN N+1 (Proactive Avoidance) -->
  <rect x="640" y="96" width="280" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="656" y="88" width="136" height="16" rx="2" fill="#f5f5f5"/>
  <text x="724" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">RUN N+1: EVOLVED</text>

  <!-- Connector from SQLite Store to Run N+1 Load -->
  <path d="M 600,234 H 610 Q 620,234 620,224 V 160 Q 620,150 630,150 H 648" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arr-evol-link)"/>
  <rect x="598" y="136" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="622" y="145" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INJECT</text>

  <!-- Step N+1.1: Load Memory & Patch Prompt -->
  <rect x="656" y="120" width="248" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="656" y="120" width="248" height="68" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="670" y="142" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">1. Memory Injected at Start</text>
  <text x="670" y="160" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace">Generator receives evolved guideline</text>
  <text x="670" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Proactively includes filing cabinet analogy</text>

  <!-- Connector N+1.1 -> N+1.2 -->
  <path d="M 780,188 V 212" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-evol-muted)"/>

  <!-- Step N+1.2: Evaluator Runs & Passes 100% -->
  <rect x="656" y="220" width="248" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="656" y="220" width="248" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="670" y="242" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">2. Evaluator: Checkpoint #5 PASS</text>
  <text x="670" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">All 7 Checkpoints Clear on Attempt #1</text>
  <text x="670" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Zero retries needed for this failure mode</text>

  <!-- Connector N+1.2 -> N+1.3 -->
  <path d="M 780,284 V 308" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-evol-muted)"/>

  <!-- Step N+1.3: Immediate Deliverable Output -->
  <rect x="656" y="316" width="248" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="656" y="316" width="248" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="670" y="338" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">3. High Quality Shipping Output</text>
  <text x="670" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Faster convergence, lower token cost</text>

  <!-- Bottom Legend -->
  <line x1="40" y1="432" x2="920" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  
  <circle cx="120" cy="453" r="4" fill="#eb6c36"/>
  <text x="132" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Failure Discovery &amp; Diagnosis</text>

  <circle cx="340" cy="453" r="4" fill="#2e5aa8"/>
  <text x="352" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rule Synthesis &amp; Prompt Injection</text>

  <circle cx="590" cy="453" r="4" fill="#2d3142"/>
  <text x="602" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Proactive Avoidance &amp; 1st-Try Pass</text>
</svg>
