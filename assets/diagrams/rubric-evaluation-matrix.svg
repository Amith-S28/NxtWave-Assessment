<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="rubric-matrix-title rubric-matrix-desc">
  <title id="rubric-matrix-title">NxtWave 7-Dimension Rubric Evaluation Matrix</title>
  <desc id="rubric-matrix-desc">Diagram showing the 7 isolated rubric checkpoint LLM evaluation gates, chain-of-thought grading, structured JSON output schemas, and binary all-or-nothing pass/fail aggregation.</desc>

  <defs>
    <marker id="arr-rubric" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-rubric-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="arr-rubric-pass" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#f8fafc" rx="8"/>

  <!-- Header -->
  <text x="40" y="44" fill="#0f172a" font-size="20" font-weight="600" font-family="'Geist', 'Segoe UI', sans-serif">The 7-Dimension Hard Pass/Fail Rubric Matrix</text>
  <text x="40" y="66" fill="#64748b" font-size="12" font-family="'Geist Mono', monospace">INDEPENDENT LLM JUDGE PROMPTS • ZERO CRITERION CONFLATION • BINARY GATES</text>

  <!-- Input Draft Source Box -->
  <rect x="40" y="96" width="180" height="360" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="52" y="104" width="76" height="14" rx="2" fill="rgba(15,23,42,0.08)" stroke="rgba(15,23,42,0.3)" stroke-width="0.8"/>
  <text x="90" y="114" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">CANDIDATE</text>
  <text x="130" y="148" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generated Lesson</text>
  <text x="130" y="168" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Full Markdown Text</text>
  
  <line x1="56" y1="184" x2="204" y2="184" stroke="rgba(30,41,59,0.12)" stroke-width="0.8"/>
  
  <text x="56" y="210" fill="#334155" font-size="10" font-family="'Geist', sans-serif">• Title &amp; Objectives</text>
  <text x="56" y="234" fill="#334155" font-size="10" font-family="'Geist', sans-serif">• Core Definition &amp; Why</text>
  <text x="56" y="258" fill="#334155" font-size="10" font-family="'Geist', sans-serif">• Real-World Analogy</text>
  <text x="56" y="282" fill="#334155" font-size="10" font-family="'Geist', sans-serif">• 3-Step Pipeline Flow</text>
  <text x="56" y="306" fill="#334155" font-size="10" font-family="'Geist', sans-serif">• Worked Example</text>
  <text x="56" y="330" fill="#334155" font-size="10" font-family="'Geist', sans-serif">• Glossary &amp; Summary</text>

  <rect x="56" y="364" width="148" height="68" rx="4" fill="rgba(37,99,235,0.04)" stroke="rgba(37,99,235,0.2)" stroke-width="0.8"/>
  <text x="130" y="386" fill="#2563eb" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parallel / Isolated</text>
  <text x="130" y="402" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7 Separate Evaluator</text>
  <text x="130" y="416" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LLM Invocations</text>

  <!-- Connectors from Input to the 7 Checkpoint Cards -->
  <!-- Fan-out paths -->
  <path d="M 220,276 H 250 Q 260,276 260,266 V 118 Q 260,110 270,110 H 280" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-rubric)"/>
  <path d="M 220,276 H 250 Q 260,276 260,266 V 168 Q 260,160 270,160 H 280" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-rubric)"/>
  <path d="M 220,276 H 250 Q 260,276 260,266 V 218 Q 260,210 270,210 H 280" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-rubric)"/>
  <path d="M 220,276 H 280" fill="none" stroke="#ea580c" stroke-width="1.2" marker-end="url(#arr-rubric-accent)"/>
  <path d="M 220,276 H 250 Q 260,276 260,286 V 324 Q 260,332 270,332 H 280" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-rubric)"/>
  <path d="M 220,276 H 250 Q 260,276 260,286 V 374 Q 260,382 270,382 H 280" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-rubric)"/>
  <path d="M 220,276 H 250 Q 260,276 260,286 V 424 Q 260,432 270,432 H 280" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-rubric)"/>

  <!-- The 7 Rubric Cards -->
  <!-- 1. Factual Accuracy -->
  <rect x="280" y="96" width="370" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <rect x="288" y="104" width="20" height="12" rx="2" fill="rgba(15,23,42,0.08)"/>
  <text x="298" y="113" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">01</text>
  <text x="316" y="114" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Factual Accuracy &amp; Grounding</text>
  <text x="298" y="128" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">PASS: RAG is inference-time retrieval • FAIL: Claims model is retrained</text>

  <!-- 2. Completeness -->
  <rect x="280" y="146" width="370" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <rect x="288" y="154" width="20" height="12" rx="2" fill="rgba(15,23,42,0.08)"/>
  <text x="298" y="163" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">02</text>
  <text x="316" y="164" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Completeness — Core Concepts</text>
  <text x="298" y="178" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">PASS: Covers What, Why, and How • FAIL: Skips retrieval or hallucination</text>

  <!-- 3. Beginner Language -->
  <rect x="280" y="196" width="370" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <rect x="288" y="204" width="20" height="12" rx="2" fill="rgba(15,23,42,0.08)"/>
  <text x="298" y="213" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">03</text>
  <text x="316" y="214" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Beginner-Friendly Language</text>
  <text x="298" y="228" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">PASS: Short sentences, 12th-grade tone • FAIL: High GRE / academic words</text>

  <!-- 4. Concrete Example & Analogy (Focal) -->
  <rect x="280" y="246" width="370" height="56" rx="4" fill="rgba(234,88,12,0.04)" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="288" y="254" width="20" height="12" rx="2" fill="rgba(234,88,12,0.15)"/>
  <text x="298" y="263" fill="#ea580c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">04</text>
  <text x="316" y="264" fill="#ea580c" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Teaches by Concrete Example &amp; Analogy</text>
  <text x="298" y="280" fill="#0f172a" font-size="8" font-family="'Geist Mono', monospace">PASS: Open-book exam analogy + Indian college admission walkthrough</text>
  <text x="298" y="292" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">FAIL: Entirely abstract without real-world scenario</text>

  <!-- 5. Zero Unexplained Jargon -->
  <rect x="280" y="310" width="370" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <rect x="288" y="318" width="20" height="12" rx="2" fill="rgba(15,23,42,0.08)"/>
  <text x="298" y="327" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">05</text>
  <text x="316" y="328" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Clear, No Unexplained Jargon</text>
  <text x="298" y="342" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">PASS: LLM, Embeddings, DB defined on first use • FAIL: Orphan jargon</text>

  <!-- 6. Coherent Teaching Flow -->
  <rect x="280" y="360" width="370" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <rect x="288" y="368" width="20" height="12" rx="2" fill="rgba(15,23,42,0.08)"/>
  <text x="298" y="377" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">06</text>
  <text x="316" y="378" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Coherent Teaching Flow</text>
  <text x="298" y="392" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">PASS: Problem → Definition → Mechanics → Example → Summary</text>

  <!-- 7. Appropriate Length & Density -->
  <rect x="280" y="410" width="370" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <rect x="288" y="418" width="20" height="12" rx="2" fill="rgba(15,23,42,0.08)"/>
  <text x="298" y="427" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">07</text>
  <text x="316" y="428" fill="#0f172a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Appropriate Length &amp; Structural Density</text>
  <text x="298" y="442" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">PASS: 700–1800 words, headers, callouts • FAIL: &lt;600w skim or giant block</text>

  <!-- Connectors from 7 Cards to the Binary Aggregator Box -->
  <path d="M 650,118 H 670 Q 680,118 680,130 V 266 Q 680,276 690,276 H 710" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 650,168 H 670 Q 680,168 680,180 V 266 Q 680,276 690,276 H 710" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 650,218 H 670 Q 680,218 680,230 V 266 Q 680,276 690,276 H 710" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 650,276 H 710" fill="none" stroke="#ea580c" stroke-width="1.2"/>
  <path d="M 650,332 H 670 Q 680,332 680,320 V 286 Q 680,276 690,276 H 710" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 650,382 H 670 Q 680,382 680,370 V 286 Q 680,276 690,276 H 710" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 650,432 H 670 Q 680,432 680,420 V 286 Q 680,276 690,276 H 710" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-rubric)"/>

  <!-- Aggregation Box: Strict Binary Gate -->
  <rect x="710" y="180" width="210" height="192" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="722" y="188" width="96" height="14" rx="2" fill="rgba(15,23,42,0.08)"/>
  <text x="770" y="198" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">BINARY VERDICT</text>
  
  <text x="815" y="228" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">All-or-Nothing Gate</text>
  <text x="815" y="246" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">No Partial Credit Allowed</text>

  <line x1="726" y1="260" x2="904" y2="260" stroke="rgba(30,41,59,0.1)" stroke-width="0.8"/>

  <!-- Branch 1: Pass -->
  <rect x="726" y="274" width="178" height="38" rx="4" fill="rgba(22,163,74,0.06)" stroke="rgba(22,163,74,0.3)" stroke-width="0.8"/>
  <text x="736" y="290" fill="#16a34a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">✅ 7 / 7 PASSED</text>
  <text x="736" y="304" fill="#15803d" font-size="8" font-family="'Geist Mono', monospace">Route: Persist Lesson Deliverable</text>

  <!-- Branch 2: Fail -->
  <rect x="726" y="320" width="178" height="38" rx="4" fill="rgba(234,88,12,0.06)" stroke="rgba(234,88,12,0.3)" stroke-width="0.8"/>
  <text x="736" y="336" fill="#ea580c" font-size="10" font-weight="600" font-family="'Geist', sans-serif">❌ ANY FAIL (1 to 7)</text>
  <text x="736" y="350" fill="#c2410c" font-size="8" font-family="'Geist Mono', monospace">Route: Diagnostic Feedback Retry</text>

  <!-- Legend -->
  <line x1="40" y1="488" x2="920" y2="488" stroke="rgba(30,41,59,0.12)" stroke-width="0.8"/>
  <text x="40" y="512" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  
  <circle cx="120" cy="509" r="4" fill="#0f172a"/>
  <text x="132" y="512" fill="#334155" font-size="9" font-family="'Geist', sans-serif">Isolated Evaluation Prompt</text>

  <circle cx="310" cy="509" r="4" fill="#ea580c"/>
  <text x="322" y="512" fill="#334155" font-size="9" font-family="'Geist', sans-serif">Core Pedagogical Anchor</text>

  <circle cx="510" cy="509" r="4" fill="#16a34a"/>
  <text x="522" y="512" fill="#334155" font-size="9" font-family="'Geist', sans-serif">100% Binary Pass Condition</text>
</svg>
