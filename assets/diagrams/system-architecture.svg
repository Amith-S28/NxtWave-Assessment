<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">NxtWave Content Systems — Agentic System Architecture</title>
  <desc id="arch-desc">Architecture diagram showing LangGraph stateful cyclic loop, memory retrieval, generator node, 7-checkpoint rubric judge, conditional router, and deliverables output.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    </style>
    <!-- Arrow Markers -->
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="960" height="520" fill="#f5f5f5"/>

  <!-- 2. Header Area -->
  <text x="40" y="44" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Self-Evaluating Content Generator</text>
  <text x="40" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LANGGRAPH CYCLIC STATE MACHINE • 7-DIMENSION HARD RUBRIC • SQLITE SELF-EVOLUTION</text>

  <!-- 3. ZONES -->
  <!-- Zone 1: Ingestion & Memory -->
  <rect x="40" y="96" width="220" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="56" y="88" width="136" height="16" rx="2" fill="#f5f5f5"/>
  <text x="124" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">1. INGESTION &amp; MEMORY</text>

  <!-- Zone 2: Stateful Agentic Core -->
  <rect x="280" y="96" width="400" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="296" y="88" width="168" height="16" rx="2" fill="#f5f5f5"/>
  <text x="380" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2. STATEFUL AGENTIC CORE</text>

  <!-- Zone 3: Storage & Deliverables -->
  <rect x="700" y="96" width="220" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="716" y="88" width="144" height="16" rx="2" fill="#f5f5f5"/>
  <text x="788" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">3. OUTPUTS &amp; SYNTHESIS</text>

  <!-- 4. CONNECTORS (Drawn before boxes) -->
  <!-- Memory to Generator (Link Blue) -->
  <path d="M 232,164 H 304" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arr-link)"/>
  
  <!-- Topic to Generator (Muted) -->
  <path d="M 232,264 H 256 Q 268,264 268,252 V 184 Q 268,172 280,172 H 304" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>

  <!-- Generator to Evaluator -->
  <path d="M 480,200 V 244" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>

  <!-- Evaluator to Router -->
  <path d="M 480,324 V 360" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>

  <!-- Router to Generator (Retry Loop with Diagnostic Feedback) -->
  <path d="M 380,390 H 324 Q 308,390 308,374 V 212 Q 308,196 324,196 H 336" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>

  <!-- Router to Persist (Pass) -->
  <path d="M 580,390 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Persist to Deliverables -->
  <path d="M 810,352 V 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>
  
  <!-- Persist back to Memory Store (Self-Evolution loop) -->
  <path d="M 810,420 V 428 Q 810,436 802,436 H 152 Q 144,436 144,428 V 370" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>

  <!-- Connector Labels (6px margin above stroke) -->
  <!-- Memory Patches Label -->
  <rect x="240" y="146" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="268" y="155" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATCHES</text>

  <!-- Candidate Draft Label -->
  <rect x="446" y="214" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="480" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANDIDATE</text>

  <!-- Retry Loop Label -->
  <rect x="272" y="280" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="308" y="289" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY + FIX</text>

  <!-- Pass Verdict Label -->
  <rect x="620" y="372" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="652" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALL PASS</text>

  <!-- Evolved Rule Injection Label -->
  <rect x="430" y="420" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="478" y="429" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVOLVED RULES</text>

  <!-- 5. NODE BOXES -->
  <!-- Node: SQLite Memory Store -->
  <rect x="56" y="128" width="176" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="128" width="176" height="72" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <rect x="64" y="136" width="48" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.4)" stroke-width="0.8"/>
  <text x="88" y="145" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY</text>
  <text x="144" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory Manager</text>
  <text x="144" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite • Evolved Rules</text>

  <!-- Node: Input Spec & Persona -->
  <rect x="56" y="228" width="176" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="228" width="176" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="64" y="236" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="82" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="144" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Topic &amp; Learner Persona</text>
  <text x="144" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">12th Grade Indian Grad</text>

  <!-- Node: Generator -->
  <rect x="304" y="128" width="352" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="128" width="352" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <rect x="312" y="136" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="342" y="145" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GENERATOR</text>
  <text x="480" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3-Layer Lesson Generator Node</text>
  <text x="480" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Base Persona + Evolved Patches + Retry Diagnostics</text>

  <!-- Node: Rubric Evaluator (Focal Accent Node) -->
  <rect x="304" y="244" width="352" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="244" width="352" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="312" y="252" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
  <text x="340" y="261" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVALUATOR</text>
  <text x="480" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7-Checkpoint Rubric Judge</text>
  <text x="480" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Independent LLM Calls • Strict Binary Pass/Fail • Chain-of-Thought</text>
  <text x="480" y="312" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Accuracy • Completeness • Language • Analogy • Jargon • Flow • Density</text>

  <!-- Node: LangGraph Router Decision -->
  <rect x="380" y="360" width="200" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="360" width="200" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="388" y="368" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="410" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
  <text x="480" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LangGraph Conditional Edge</text>
  <text x="480" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">All Passed? OR Retries &gt;= Max (2)?</text>

  <!-- Node: Persist & Export -->
  <rect x="720" y="352" width="180" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="352" width="180" height="68" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="728" y="360" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="752" y="369" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSIST</text>
  <text x="810" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory Persist Node</text>
  <text x="810" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Distill Rules • Save Artifacts</text>

  <!-- Node: Final Deliverables -->
  <rect x="720" y="128" width="180" height="152" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="128" width="180" height="152" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="728" y="136" width="68" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="762" y="145" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DELIVERABLES</text>
  
  <text x="736" y="174" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Lesson Markdown</text>
  <text x="736" y="190" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">output/lesson_*.md</text>
  
  <line x1="736" y1="202" x2="884" y2="202" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

  <text x="736" y="222" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Rejection Log</text>
  <text x="736" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">output/rejection_log_*.json</text>

  <line x1="736" y1="250" x2="884" y2="250" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="810" y="268" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">READY FOR PRODUCTION</text>

  <!-- 6. Bottom Legend -->
  <line x1="40" y1="464" x2="920" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  
  <circle cx="120" cy="485" r="4" fill="#2d3142"/>
  <text x="132" y="488" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Execution Flow</text>

  <circle cx="260" cy="485" r="4" fill="#eb6c36"/>
  <text x="272" y="488" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Evaluation &amp; Retry Diagnostics</text>

  <circle cx="480" cy="485" r="4" fill="#2e5aa8"/>
  <text x="492" y="488" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Memory Retrieval &amp; Ingestion</text>
</svg>
