<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">NxtWave Content Systems — Agentic System Architecture</title>
  <desc id="arch-desc">Architecture diagram showing LangGraph stateful cyclic loop, memory retrieval, generator node, 7-checkpoint rubric judge, conditional router, and deliverables output.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    </style>
    <!-- Arrow Markers -->
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="960" height="520" fill="#f5f5f5"/>

  <!-- 2. Header Area -->
  <text x="40" y="44" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Self-Evaluating Content Generator</text>
  <text x="40" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LANGGRAPH CYCLIC STATE MACHINE • 7-DIMENSION HARD RUBRIC • SQLITE SELF-EVOLUTION</text>

  <!-- 3. ZONES -->
  <!-- Zone 1: Ingestion & Memory -->
  <rect x="40" y="96" width="220" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="56" y="88" width="136" height="16" rx="2" fill="#f5f5f5"/>
  <text x="124" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">1. INGESTION &amp; MEMORY</text>

  <!-- Zone 2: Stateful Agentic Core -->
  <rect x="280" y="96" width="400" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="296" y="88" width="168" height="16" rx="2" fill="#f5f5f5"/>
  <text x="380" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2. STATEFUL AGENTIC CORE</text>

  <!-- Zone 3: Storage & Deliverables -->
  <rect x="700" y="96" width="220" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="716" y="88" width="144" height="16" rx="2" fill="#f5f5f5"/>
  <text x="788" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">3. OUTPUTS &amp; SYNTHESIS</text>

  <!-- 4. CONNECTORS (Drawn before boxes) -->
  <!-- Memory to Generator (Link Blue) -->
  <path d="M 244,144 H 320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arr-link)"/>
  
  <!-- Topic to Generator (Muted) -->
  <path d="M 244,264 H 268 Q 276,264 276,256 V 184 Q 276,176 284,176 H 320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>

  <!-- Generator to Evaluator -->
  <path d="M 488,196 V 236" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>

  <!-- Evaluator to Router -->
  <path d="M 488,320 V 356" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>

  <!-- Router to Generator (Retry Loop with Diagnostic Feedback) -->
  <!-- Routes left to x=292 (28px clear of Rubric Box at x=320), then up to y=160, and right into Generator -->
  <path d="M 388,386 H 300 Q 292,386 292,378 V 168 Q 292,160 300,160 H 320" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>

  <!-- Router to Persist (Pass) -->
  <path d="M 588,386 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Persist to Deliverables -->
  <path d="M 810,350 V 276" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/>
  
  <!-- Persist to Ingestion / Persona (Cross-Run Self-Evolution Loop) -->
  <!-- Routes down to y=448, across bottom to x=150, and straight up into Topic & Learner Persona bottom at y=300 -->
  <path d="M 810,422 V 440 Q 810,448 802,448 H 158 Q 150,448 150,440 V 300" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>

  <!-- Connector Labels (with clean background mask rects) -->
  <!-- Patches Label -->
  <rect x="256" y="137" width="52" height="14" rx="2" fill="#f5f5f5"/>
  <text x="282" y="147" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATCHES</text>

  <!-- Candidate Draft Label -->
  <rect x="444" y="209" width="88" height="14" rx="2" fill="#f5f5f5"/>
  <text x="488" y="219" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANDIDATE DRAFT</text>

  <!-- Retry Loop Label -->
  <rect x="238" y="271" width="108" height="14" rx="2" fill="#f5f5f5"/>
  <text x="292" y="281" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY + DIAGNOSTICS</text>

  <!-- All Pass Label -->
  <rect x="620" y="379" width="68" height="14" rx="2" fill="#f5f5f5"/>
  <text x="654" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALL 7 PASS</text>

  <!-- Export Label -->
  <rect x="786" y="306" width="48" height="14" rx="2" fill="#f5f5f5"/>
  <text x="810" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXPORT</text>

  <!-- Evolved Rules Injection Label -->
  <rect x="360" y="441" width="240" height="14" rx="2" fill="#f5f5f5"/>
  <text x="480" y="451" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVOLVED RULES PERSISTED FOR RUN N+1</text>

  <!-- 5. NODE BOXES -->
  <!-- Node: SQLite Memory Store -->
  <rect x="56" y="124" width="188" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="124" width="188" height="72" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <rect x="64" y="132" width="48" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.4)" stroke-width="0.8"/>
  <text x="88" y="141" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY</text>
  <text x="150" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory Manager</text>
  <text x="150" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite • Evolved Rules</text>

  <!-- Node: Input Spec & Persona -->
  <rect x="56" y="228" width="188" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="228" width="188" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="64" y="236" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="82" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="150" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Topic &amp; Learner Persona</text>
  <text x="150" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">12th Grade Indian Grad</text>

  <!-- Node: Generator -->
  <rect x="320" y="124" width="336" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="320" y="124" width="336" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <rect x="328" y="132" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="358" y="141" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GENERATOR</text>
  <text x="488" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3-Layer Lesson Generator Node</text>
  <text x="488" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Base Persona + Evolved Patches + Retry Diagnostics</text>

  <!-- Node: Rubric Evaluator (Focal Accent Node) -->
  <rect x="320" y="236" width="336" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="320" y="236" width="336" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="328" y="244" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
  <text x="356" y="253" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVALUATOR</text>
  <text x="488" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7-Checkpoint Rubric Judge</text>
  <text x="488" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Independent LLM Calls • Strict Binary Pass/Fail • Chain-of-Thought</text>
  <text x="488" y="304" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Accuracy • Completeness • Language • Analogy • Jargon • Flow • Density</text>

  <!-- Node: LangGraph Router Decision -->
  <rect x="388" y="356" width="200" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="388" y="356" width="200" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="396" y="364" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="418" y="373" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
  <text x="488" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LangGraph Conditional Edge</text>
  <text x="488" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">All Passed? OR Retries &gt;= Max (2)?</text>

  <!-- Node: Persist & Export -->
  <rect x="720" y="350" width="180" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="350" width="180" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="728" y="358" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="752" y="367" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSIST</text>
  <text x="810" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory Persist Node</text>
  <text x="810" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Distill Rules • Save Artifacts</text>

  <!-- Node: Final Deliverables -->
  <rect x="720" y="124" width="180" height="152" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="124" width="180" height="152" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="728" y="132" width="68" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="762" y="141" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DELIVERABLES</text>
  
  <text x="736" y="170" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Lesson Markdown</text>
  <text x="736" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">output/lesson_*.md</text>
  
  <line x1="736" y1="198" x2="884" y2="198" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

  <text x="736" y="218" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Rejection Log</text>
  <text x="736" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">output/rejection_log_*.json</text>

  <line x1="736" y1="246" x2="884" y2="246" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="810" y="264" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">READY FOR PRODUCTION</text>

  <!-- 6. Bottom Legend -->
  <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="494" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  
  <circle cx="120" cy="491" r="4" fill="#2d3142"/>
  <text x="132" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Execution Flow</text>

  <circle cx="260" cy="491" r="4" fill="#eb6c36"/>
  <text x="272" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Evaluation &amp; Retry Diagnostics</text>

  <circle cx="480" cy="491" r="4" fill="#2e5aa8"/>
  <text x="492" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Memory Retrieval &amp; Ingestion</text>
</svg>
